name: daily-support-scan

on:
  schedule:
    - cron: "10 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: run scanner
        run: python scanner.py
      - name: commit results
        run: |
          git config user.name "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/signals.json signals.csv || true
          git diff --cached --quiet || git commit -m "scan $(date -u +%F)"
          git push
